spring.application.name=simulador-linguagens-formais

# O build do frontend gera arquivos com hash no nome (assets/index-XXXX.js).
# O index.html precisa ser sempre o mais novo, senão aponta para um .js que
# não existe mais e a página fica em branco. no-cache obriga o navegador a
# pedir de novo, e sem Last-Modified (todo arquivo do jar tem a mesma data
# fixa) o servidor não responde "não mudou" por engano.
# Os arquivos de assets/ têm cache longo: ver infraestrutura.RecursosEstaticosConfig.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.use-last-modified=false
