spring.application.name=simulador-linguagens-formais

# O build do frontend gera arquivos com hash no nome (assets/index-XXXX.js).
# Sem revalidação, o navegador pode reaproveitar um index.html antigo que
# aponta para um arquivo que não existe mais, e a página fica em branco.
# no-cache faz o navegador conferir com o servidor (resposta 304 se nada mudou).
spring.web.resources.cache.cachecontrol.no-cache=true
